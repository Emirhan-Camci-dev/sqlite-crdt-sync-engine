[package]
name = "syncengine-pro-validator"
version = "1.0.0"
edition = "2021"
authors = ["Emirhan CAMCI <byemir@live.com>"]
description = "Offline license key validation engine for SyncEngine Pro"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
ed25519-dalek = "2.0"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
